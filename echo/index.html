    <header class="echo-topbar" aria-label="Echo navigation">
      <nav class="echo-nav">
        <span class="echo-nav-brand">ECHO</span>
        <div class="echo-nav-stores">
          <a class="echo-store-button" rel="noopener noreferrer" href="https://apps.apple.com/sg/app/echo-your-quote/id6754518887">APP STORE</a>

        </div>
      </nav>
    </header>

    <main id="main" class="terminal-main shell" tabindex="-1">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-main">
          <h1 id="hero-title">ECHO</h1>
          <p class="hero-copy command-copy">
            <span>Transmit a signal.</span>

        </div>
      </section>

      <section aria-labelledby="void-preview-title">
        <div class="section-heading">
          <h2 id="void-preview-title">FROM THE VOID</h2>
          <p class="section-note">PUBLIC SIGNALS / ANONYMOUS BEACONS</p>
        </div>
        <div id="echo-preview" class="echo-carousel" aria-live="polite" aria-busy="true">
          <div class="status-panel">&gt; ACCESSING VOID<span class="cursor" aria-hidden="true">_</span></div>
        </div>
      </section>

      <div class="section-action">
        <a class="button button-accent" href="./void/">VIEW THE VOID</a>
